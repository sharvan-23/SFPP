<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>किसान सेवा — कतार और टोकन</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#274B63;
    --sky-mid:#3C7A6B;
    --field:#1F3D2C;
    --field-dark:#152A1E;
    --sun:#F2B441;
    --sun-soft:#F7CE7A;
    --cream:#FBF4E4;
    --cream-dim:#D9CDAE;
    --leaf:#5C9A63;
    --alert:#C1440E;
    --ink:#122016;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'Hind',sans-serif;
    color:var(--cream);
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 46%, var(--field) 47%, var(--field-dark) 100%);
    padding: 24px;
  }

  header{
    text-align:center;
  }
  .brand{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--sun-soft);
    margin:0;
  }
  .brand span{color:var(--cream);}

  /* --- Token Card Box --- */
  main{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  .token-card{
    width:100%;
    background:rgba(18,32,22,0.75);
    border:2px solid rgba(242,180,65,0.3);
    backdrop-filter:blur(8px);
    border-radius:24px;
    padding:28px 20px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }

  .token-title{
    font-size:16px;
    color:var(--cream-dim);
    margin:0 0 8px;
    font-weight:500;
  }

  .token-number{
    font-family:'Baloo 2',sans-serif;
    font-size:56px;
    font-weight:700;
    color:var(--sun);
    line-height:1;
    margin:0 0 16px;
  }

  .badge-status{
    display:inline-block;
    background:rgba(92,154,99,0.25);
    border:1px solid var(--leaf);
    color:#94e29d;
    padding:6px 16px;
    border-radius:99px;
    font-size:14px;
    font-weight:600;
  }

  .info-box{
    width:100%;
    background:rgba(255,255,255,0.06);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:15px;
  }
  .info-row{
    display:flex;
    justify-content:space-between;
  }
  .info-label{color:var(--cream-dim);}
  .info-val{font-weight:600;color:var(--cream);}

  /* --- Back button --- */
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--ink);
    background:var(--cream);
    font-weight:600;
    font-size:16px;
    padding:12px 24px;
    border-radius:99px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }

  /* --- Floating Mini Mic (Bottom Right) --- */
  #gfva-root{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:99999;
  }
  .gfva-mic-btn{
    width:60px;
    height:60px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 32% 28%, var(--sun-soft), var(--sun) 65%);
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    transition:transform 0.2s ease;
  }
  .gfva-mic-btn:active{transform:scale(0.92);}
  .gfva-mic-btn svg{width:26px;height:26px;}
  
  .gfva-status{
    position:absolute;
    right:72px;
    bottom:10px;
    background:#122016;
    color:var(--cream);
    padding:6px 12px;
    border-radius:8px;
    font-size:13px;
    border:1px solid rgba(255,255,255,0.2);
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .gfva-status.show{opacity:1;}
</style>
</head>
<body>

  <header>
    <p class="brand"><span>किसान</span> प्रोक्योरमेंट सेवा</p>
  </header>

  <main>
    <div class="token-card">
      <p class="token-title">आपका वर्तमान टोकन नंबर</p>
      <h1 class="token-number">#42</h1>
      <span class="badge-status">कतार में सक्रिय</span>
    </div>

    <div class="info-box">
      <div class="info-row">
        <span class="info-label">अनुमानित प्रतीक्षा समय:</span>
        <span class="info-val">लगभग 15 मिनट</span>
      </div>
      <div class="info-row">
        <span class="info-label">केंद्र:</span>
        <span class="info-val">रामपुर मंडी केंद्र</span>
      </div>
    </div>

    <a class="back-btn" href="index.html">
      ← मुख्य पृष्ठ पर जाएं
    </a>
  </main>

  <footer>
    <p style="font-size:13px; color:var(--cream-dim); margin:0;">किसी भी सहायता के लिए माइक दबाकर बोलें</p>
  </footer>

  <!-- FLOATING MINI MIC -->
  <div id="gfva-root">
    <div class="gfva-status" id="gfva-status">बोलकर मदद लें</div>
    <button type="button" class="gfva-mic-btn" id="gfva-mic-btn" aria-label="Voice Assistant">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15Z" fill="#122016"/>
        <path d="M6.5 11.5a5.5 5.5 0 0 0 11 0" stroke="#122016" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12 17v3.2M9.2 20.2h5.6" stroke="#122016" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

<script>
(function(){
  var micBtn = document.getElementById('gfva-mic-btn');
  var statusBubble = document.getElementById('gfva-status');
  var SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechAPI) return;

  var rec = new SpeechAPI();
  rec.lang = 'hi-IN';
  rec.continuous = false;
  rec.interimResults = false;

  micBtn.onclick = function(){
    try { rec.start(); } catch(e){}
  };

  rec.onstart = function(){
    statusBubble.textContent = "सुन रहे हैं...";
    statusBubble.classList.add('show');
  };

  rec.onresult = function(e){
    var text = (e.results[0][0].transcript || '').toLowerCase();
    statusBubble.textContent = 'सुना: "' + text + '"';

    if(text.includes('होम') || text.includes('wapas') || text.includes('mukhy')){
      window.location.href = 'index.html';
    } else if(text.includes('बेचना') || text.includes('fasal')){
      window.location.href = 'visual-login.html';
    }
  };

  rec.onend = function(){
    setTimeout(function(){
      statusBubble.classList.remove('show');
    }, 2500);
  };
})();
</script>
</body>
</html>
