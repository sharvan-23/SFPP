<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>किसान सेवा — स्वागत है</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<script>
(function(){
  "use strict";

  var assistantText = document.getElementById('assistant-text');
  var tapHint = document.getElementById('tap-hint');
  var transcriptText = document.getElementById('transcript-text');
  var micBtn = document.getElementById('mic-btn');
  var micWrap = document.getElementById('mic-wrap');
  var unsupportedBanner = document.getElementById('unsupported-banner');

  var SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  var synth = window.speechSynthesis;
  var recognition = null;
  var hindiVoice = null;
  var isListening = false;

  var WELCOME_MESSAGE = 'नमस्ते किसान भाई। आप नई फसल बेचना चाहते हैं, या अपना टोकन नंबर देखना चाहते हैं? माइक दबाकर बोलें।';

  // --- 1. SARE PAGES KE KEYWORDS (DICTIONARY) ---
  var SELL_KEYWORDS = ['बेचना', 'फसल', 'book', 'bechna', 'रजिस्ट्रेशन', 'पंजीकरण', 'register', 'registration', 'बेचनी'];
  var TOKEN_KEYWORDS = ['नंबर', 'टोकन', 'number', 'token', 'कतार', 'queue', 'लाइन'];
  var TRACK_KEYWORDS = ['रसीद', 'पैसे', 'स्टेटस', 'ट्रैक', 'receipt', 'payment', 'track', 'status', 'पर्ची', 'ट्रैकिंग'];
  var FORM_KEYWORDS = ['फॉर्म', 'लिख', 'form', 'type', 'मैनुअल'];

  function setState(state){
    micWrap.classList.remove('idle', 'listening', 'thinking');
    micBtn.classList.remove('listening', 'thinking');
    if (state === 'idle'){
      micWrap.classList.add('idle');
    } else if (state === 'listening'){
      micWrap.classList.add('listening');
      micBtn.classList.add('listening');
    } else if (state === 'thinking'){
      micWrap.classList.add('thinking');
      micBtn.classList.add('thinking');
    }
  }

  function pickHindiVoice(){
    if (!synth) return;
    var voices = synth.getVoices();
    hindiVoice = voices.find(function(v){ return v.lang === 'hi-IN'; }) ||
                 voices.find(function(v){ return v.lang && v.lang.indexOf('hi') === 0; }) ||
                 null;
  }

  if (synth){
    pickHindiVoice();
    synth.onvoiceschanged = pickHindiVoice;
  }

  function speak(text){
    assistantText.textContent = text;
    if (!synth) return;
    synth.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'hi-IN';
    if (hindiVoice) utter.voice = hindiVoice;
    utter.rate = 0.95;
    utter.pitch = 1;
    synth.speak(utter);
  }

  function normalize(str){
    return (str || '').toLowerCase();
  }

  function matchesAny(transcript, keywords){
    var lower = normalize(transcript);
    return keywords.some(function(k){ return lower.indexOf(normalize(k)) !== -1; });
  }

  // --- 2. AI SMART ROUTER (CHROME FIX KE SATH) ---
  function handleTranscript(transcript){
    transcriptText.textContent = 'आपने कहा: "' + transcript + '"';
    setState('thinking');
    tapHint.textContent = 'समझ रहे हैं...';

    // GUARANTEED REDIRECT (Ye page 100% badlega)
    function goToPage(url) {
      setTimeout(function() {
        window.location.href = url;
      }, 2000);
    }

    if (matchesAny(transcript, TOKEN_KEYWORDS)){
      speak('आपको कतार पेज पर ले जाया जा रहा है');
      goToPage('queue.html');
    } else if (matchesAny(transcript, TRACK_KEYWORDS)){
      speak('आपकी रसीद और पेमेंट का स्टेटस पेज खुल रहा है');
      goToPage('tracking.html');
    } else if (matchesAny(transcript, FORM_KEYWORDS)){
      speak('लिखकर फॉर्म भरने वाला पेज खुल रहा है');
      goToPage('manual-login.html');
    } else if (matchesAny(transcript, SELL_KEYWORDS)){
      speak('ठीक है, फसल बेचने के लिए आगे बढ़ते हैं');
      goToPage('visual-login.html');
    } else {
      setState('idle');
      tapHint.textContent = 'माइक दबाकर बोलें';
      speak('माफ़ कीजिए, समझ नहीं पाया। कृपया "टोकन", "रसीद", या "फसल बेचना" बोलें।');
    }
  }

  function startListening(){
    if (!recognition || isListening) return;
    if (synth) synth.cancel();
    transcriptText.textContent = '';
    try {
      recognition.start();
    } catch (err){}
  }

  function initRecognition(){
    if (!SpeechRecognitionAPI){
      unsupportedBanner.style.display = 'block';
      micBtn.disabled = true;
      tapHint.textContent = 'नीचे बटन से फॉर्म भरें';
      return;
    }

    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'hi-IN';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){
      isListening = true;
      setState('listening');
      tapHint.textContent = 'सुन रहे हैं... बोलिए';
      assistantText.textContent = 'सुन रहा हूँ...';
    };

    recognition.onresult = function(event){
      var transcript = event.results && event.results[0] && event.results[0][0]
        ? event.results[0][0].transcript
        : '';
      handleTranscript(transcript);
    };

    recognition.onerror = function(event){
      isListening = false;
      setState('idle');
      if (event.error === 'no-speech'){
        tapHint.textContent = 'कुछ सुनाई नहीं दिया, फिर कोशिश करें';
        speak('कुछ सुनाई नहीं दिया। कृपया फिर से माइक दबाएँ।');
      } else if (event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        tapHint.textContent = 'माइक की अनुमति दें';
        assistantText.textContent = 'कृपया ब्राउज़र में माइक की अनुमति दें, या नीचे बटन से फॉर्म भरें।';
      } else {
        tapHint.textContent = 'माइक दबाकर बोलें';
      }
    };

    recognition.onend = function(){
      isListening = false;
      if (!micBtn.classList.contains('thinking')){
        setState('idle');
      }
    };

    micBtn.addEventListener('click', startListening);
  }

  initRecognition();

  window.addEventListener('load', function(){
    setState('idle');
    speak(WELCOME_MESSAGE);
  });

})();
</script>
</head>
<body>

  <div class="sun" aria-hidden="true"></div>
  <div class="field-lines" aria-hidden="true">
    <svg viewBox="0 0 400 220" preserveAspectRatio="none">
      <path d="M0,40 L400,10 L400,220 L0,220 Z" fill="#24462F"/>
      <path d="M0,90 L400,60 L400,220 L0,220 Z" fill="#1B3A27"/>
      <path d="M0,140 L400,120 L400,220 L0,220 Z" fill="#152E1E"/>
    </svg>
  </div>

  <header>
    <p class="brand"><span>किसान</span> प्रोक्योरमेंट सेवा</p>
  </header>

  <main>
    <div class="speech-card" role="status" aria-live="polite">
      <p id="assistant-text">नमस्ते किसान भाई। आप नई फसल बेचना चाहते हैं, या अपना टोकन नंबर देखना चाहते हैं?</p>
    </div>

    <div>
      <div class="mic-wrap idle" id="mic-wrap">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <button id="mic-btn" type="button" aria-label="बोलने के लिए माइक दबाएँ">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15Z" fill="#122016"/>
            <path d="M6.5 11.5a5.5 5.5 0 0 0 11 0" stroke="#122016" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 17v3.2M9.2 20.2h5.6" stroke="#122016" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <p class="tap-hint" id="tap-hint">माइक दबाकर बोलें</p>
      <p class="transcript" id="transcript-text"></p>
    </div>
  </main>

  <div class="unsupported-banner" id="unsupported-banner">
    आपके ब्राउज़र में आवाज़ की सुविधा उपलब्ध नहीं है। कृपया नीचे दिए गए बटन से फॉर्म भरें।
  </div>

  <footer>
    <a class="manual-btn" href="manual-login.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 19.5V17a2 2 0 0 1 2-2h1M14.5 5.5l4 4L9 19H5v-4L14.5 5.5Z" stroke="#122016" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      लिखकर फॉर्म भरें
    </a>
  </footer>

<script>
(function(){
  "use strict";

  var assistantText = document.getElementById('assistant-text');
  var tapHint = document.getElementById('tap-hint');
  var transcriptText = document.getElementById('transcript-text');
  var micBtn = document.getElementById('mic-btn');
  var micWrap = document.getElementById('mic-wrap');
  var unsupportedBanner = document.getElementById('unsupported-banner');

  var SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  var synth = window.speechSynthesis;
  var recognition = null;
  var hindiVoice = null;
  var isListening = false;

  var WELCOME_MESSAGE = 'नमस्ते किसान भाई। आप नई फसल बेचना चाहते हैं, या अपना टोकन नंबर देखना चाहते हैं? माइक दबाकर बोलें।';

  // --- 1. SARE PAGES KE KEYWORDS (DICTIONARY) ---
  var SELL_KEYWORDS = ['बेचना', 'फसल', 'book', 'bechna', 'रजिस्ट्रेशन', 'पंजीकरण', 'register', 'registration', 'बेचनी'];
  var TOKEN_KEYWORDS = ['नंबर', 'टोकन', 'number', 'token', 'कतार', 'queue', 'लाइन'];
  var TRACK_KEYWORDS = ['रसीद', 'पैसे', 'स्टेटस', 'ट्रैक', 'receipt', 'payment', 'track', 'status', 'पर्ची', 'ट्रैकिंग'];
  var FORM_KEYWORDS = ['फॉर्म', 'लिख', 'form', 'type', 'मैनुअल'];

  function setState(state){
    micWrap.classList.remove('idle', 'listening', 'thinking');
    micBtn.classList.remove('listening', 'thinking');
    if (state === 'idle'){
      micWrap.classList.add('idle');
    } else if (state === 'listening'){
      micWrap.classList.add('listening');
      micBtn.classList.add('listening');
    } else if (state === 'thinking'){
      micWrap.classList.add('thinking');
      micBtn.classList.add('thinking');
    }
  }

  function pickHindiVoice(){
    if (!synth) return;
    var voices = synth.getVoices();
    hindiVoice = voices.find(function(v){ return v.lang === 'hi-IN'; }) ||
                 voices.find(function(v){ return v.lang && v.lang.indexOf('hi') === 0; }) ||
                 null;
  }

  if (synth){
    pickHindiVoice();
    synth.onvoiceschanged = pickHindiVoice;
  }

  function speak(text, onDone){
    assistantText.textContent = text;
    if (!synth){
      if (onDone) setTimeout(onDone, 400);
      return;
    }
    synth.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'hi-IN';
    if (hindiVoice) utter.voice = hindiVoice;
    utter.rate = 0.95;
    utter.pitch = 1;
    var finished = false;
    function finish(){
      if (finished) return;
      finished = true;
      if (onDone) onDone();
    }
    utter.onend = finish;
    utter.onerror = finish;
    setTimeout(finish, Math.max(2500, text.length * 90));
    synth.speak(utter);
  }

  function normalize(str){
    return (str || '').toLowerCase();
  }

  function matchesAny(transcript, keywords){
    var lower = normalize(transcript);
    return keywords.some(function(k){ return lower.indexOf(normalize(k)) !== -1; });
  }

  // --- 2. AI SMART ROUTER (KAUNSI AWAAZ PAR KAUNSA PAGE) ---
  function handleTranscript(transcript){
    transcriptText.textContent = 'आपने कहा: "' + transcript + '"';
    setState('thinking');
    tapHint.textContent = 'समझ रहे हैं...';

    if (matchesAny(transcript, TOKEN_KEYWORDS)){
      speak('आपको कतार पेज पर ले जाया जा रहा है', function(){
        window.location.href = 'queue.html';
      });
    } else if (matchesAny(transcript, TRACK_KEYWORDS)){
      speak('आपकी रसीद और पेमेंट का स्टेटस पेज खुल रहा है', function(){
        window.location.href = 'tracking.html';
      });
    } else if (matchesAny(transcript, FORM_KEYWORDS)){
      speak('लिखकर फॉर्म भरने वाला पेज खुल रहा है', function(){
        window.location.href = 'manual-login.html';
      });
    } else if (matchesAny(transcript, SELL_KEYWORDS)){
      speak('ठीक है, फसल बेचने के लिए आगे बढ़ते हैं', function(){
        window.location.href = 'visual-login.html';
      });
    } else {
      setState('idle');
      tapHint.textContent = 'माइक दबाकर बोलें';
      speak('माफ़ कीजिए, समझ नहीं पाया। कृपया "टोकन", "रसीद", या "फसल बेचना" बोलें।');
    }
  }

  function startListening(){
    if (!recognition || isListening) return;
    if (synth) synth.cancel();
    transcriptText.textContent = '';
    try {
      recognition.start();
    } catch (err){
    }
  }

  function initRecognition(){
    if (!SpeechRecognitionAPI){
      unsupportedBanner.style.display = 'block';
      micBtn.disabled = true;
      tapHint.textContent = 'नीचे बटन से फॉर्म भरें';
      return;
    }

    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'hi-IN';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){
      isListening = true;
      setState('listening');
      tapHint.textContent = 'सुन रहे हैं... बोलिए';
      assistantText.textContent = 'सुन रहा हूँ...';
    };

    recognition.onresult = function(event){
      var transcript = event.results && event.results[0] && event.results[0][0]
        ? event.results[0][0].transcript
        : '';
      handleTranscript(transcript);
    };

    recognition.onerror = function(event){
      isListening = false;
      setState('idle');
      if (event.error === 'no-speech'){
        tapHint.textContent = 'कुछ सुनाई नहीं दिया, फिर कोशिश करें';
        speak('कुछ सुनाई नहीं दिया। कृपया फिर से माइक दबाएँ।');
      } else if (event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        tapHint.textContent = 'माइक की अनुमति दें';
        assistantText.textContent = 'कृपया ब्राउज़र में माइक की अनुमति दें, या नीचे बटन से फॉर्म भरें।';
      } else {
        tapHint.textContent = 'माइक दबाकर बोलें';
      }
    };

    recognition.onend = function(){
      isListening = false;
      if (!micBtn.classList.contains('thinking')){
        setState('idle');
      }
    };

    micBtn.addEventListener('click', startListening);
  }

  initRecognition();

  window.addEventListener('load', function(){
    setState('idle');
    speak(WELCOME_MESSAGE);
  });

})();
</script>
</body>
</html>
