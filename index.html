<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>किसान सेवा — स्वागत है</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#274B63;
    --sky-mid:#3C7A6B;
    --field:#1F3D2C;
    --field-dark:#152A1E;
    --sun:#F2B441;
    --sun-soft:#F7CE7A;
    --cream:#FBF4E4;
    --cream-dim:#D9CDAE;
    --leaf:#5C9A63;
    --alert:#C1440E;
    --ink:#122016;
    --focus:#F2B441;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'Hind',sans-serif;
    color:var(--cream);
    overflow:hidden;
  }
  body{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 46%, var(--field) 47%, var(--field-dark) 100%);
  }

  .sun{
    position:absolute;
    top:9%;
    right:12%;
    width:92px;
    height:92px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--sun-soft), var(--sun) 70%);
    box-shadow:0 0 60px 18px rgba(242,180,65,0.35);
  }

  .field-lines{
    position:absolute;
    left:0;
    right:0;
    top:46%;
    height:54%;
    overflow:hidden;
    pointer-events:none;
  }
  .field-lines svg{width:100%;height:100%;display:block;}

  header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:34px 24px 8px;
  }
  .brand{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.2px;
    color:var(--sun-soft);
    margin:0 0 4px;
  }
  .brand span{color:var(--cream);}

  main{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:0 24px;
    text-align:center;
    gap:28px;
  }

  .speech-card{
    max-width:520px;
    background:rgba(18,32,22,0.55);
    border:1px solid rgba(251,244,228,0.18);
    backdrop-filter:blur(6px);
    border-radius:18px;
    padding:20px 24px;
    min-height:96px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .speech-card p{
    margin:0;
    font-size:20px;
    line-height:1.6;
    font-weight:500;
    color:var(--cream);
  }

  .mic-wrap{
    position:relative;
    width:220px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    border:2px solid var(--sun);
    opacity:0;
    inset:0;
  }
  .mic-wrap.idle .ring{animation:pulse-ring 2.6s ease-out infinite;}
  .mic-wrap.idle .ring:nth-child(2){animation-delay:0.9s;}
  .mic-wrap.idle .ring:nth-child(3){animation-delay:1.8s;}
  @keyframes pulse-ring{
    0%{transform:scale(0.72);opacity:0.55;}
    100%{transform:scale(1.55);opacity:0;}
  }
  .mic-wrap.listening .ring{
    border-color:var(--alert);
    animation:pulse-ring-fast 1.1s ease-out infinite;
  }
  .mic-wrap.listening .ring:nth-child(2){animation-delay:0.35s;}
  .mic-wrap.listening .ring:nth-child(3){animation-delay:0.7s;}
  @keyframes pulse-ring-fast{
    0%{transform:scale(0.8);opacity:0.65;}
    100%{transform:scale(1.4);opacity:0;}
  }

  #mic-btn{
    position:relative;
    z-index:2;
    width:148px;
    height:148px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 32% 28%, var(--sun-soft), var(--sun) 65%);
    box-shadow:0 14px 34px rgba(0,0,0,0.35), inset 0 -6px 14px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.18s ease, background 0.3s ease, box-shadow 0.3s ease;
  }
  #mic-btn:active{transform:scale(0.94);}
  #mic-btn svg{width:60px;height:60px;}
  #mic-btn.listening{
    background:radial-gradient(circle at 32% 28%, #E9704F, var(--alert) 68%);
  }
  #mic-btn.thinking{
    background:radial-gradient(circle at 32% 28%, #8FC79A, var(--leaf) 68%);
  }
  #mic-btn:disabled{cursor:not-allowed;filter:saturate(0.5);}

  .tap-hint{
    font-size:15px;
    color:var(--cream-dim);
    font-weight:500;
    min-height:20px;
  }

  .transcript{
    font-size:15px;
    color:var(--sun-soft);
    font-weight:500;
    min-height:20px;
  }

  footer{
    position:relative;
    z-index:2;
    width:100%;
    padding:20px 24px 34px;
    display:flex;
    justify-content:center;
  }
  .manual-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--ink);
    background:var(--cream);
    font-weight:600;
    font-size:17px;
    padding:14px 26px;
    border-radius:999px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .manual-btn svg{width:20px;height:20px;flex:none;}

  .unsupported-banner{
    position:relative;
    z-index:2;
    margin:0 24px;
    padding:12px 16px;
    background:rgba(193,68,14,0.85);
    border-radius:12px;
    font-size:14px;
    text-align:center;
    display:none;
  }
</style>
</head>
<body>

  <div class="sun" aria-hidden="true"></div>
  <div class="field-lines" aria-hidden="true">
    <svg viewBox="0 0 400 220" preserveAspectRatio="none">
      <path d="M0,40 L400,10 L400,220 L0,220 Z" fill="#24462F"/>
      <path d="M0,90 L400,60 L400,220 L0,220 Z" fill="#1B3A27"/>
      <path d="M0,140 L400,120 L400,220 L0,220 Z" fill="#152E1E"/>
    </svg>
  </div>

  <header>
    <p class="brand"><span>किसान</span> प्रोक्योरमेंट सेवा</p>
  </header>

  <main>
    <div class="speech-card" role="status" aria-live="polite">
      <p id="assistant-text">नमस्ते किसान भाई। आप नई फसल बेचना चाहते हैं, या अपना टोकन नंबर देखना चाहते हैं?</p>
    </div>

    <div>
      <div class="mic-wrap idle" id="mic-wrap">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <button id="mic-btn" type="button" aria-label="बोलने के लिए माइक दबाएँ">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15Z" fill="#122016"/>
            <path d="M6.5 11.5a5.5 5.5 0 0 0 11 0" stroke="#122016" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 17v3.2M9.2 20.2h5.6" stroke="#122016" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <p class="tap-hint" id="tap-hint">माइक दबाकर बोलें</p>
      <p class="transcript" id="transcript-text"></p>
    </div>
  </main>

  <div class="unsupported-banner" id="unsupported-banner">
    आपके ब्राउज़र में आवाज़ की सुविधा उपलब्ध नहीं है। कृपया नीचे दिए गए बटन से फॉर्म भरें।
  </div>

  <footer>
    <a class="manual-btn" href="manual-login.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 19.5V17a2 2 0 0 1 2-2h1M14.5 5.5l4 4L9 19H5v-4L14.5 5.5Z" stroke="#122016" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      लिखकर फॉर्म भरें
    </a>
  </footer>

<script>
(function(){
  "use strict";

  var assistantText = document.getElementById('assistant-text');
  var tapHint = document.getElementById('tap-hint');
  var transcriptText = document.getElementById('transcript-text');
  var micBtn = document.getElementById('mic-btn');
  var micWrap = document.getElementById('mic-wrap');
  var unsupportedBanner = document.getElementById('unsupported-banner');

  var SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  var synth = window.speechSynthesis;
  var recognition = null;
  var hindiVoice = null;
  var isListening = false;

  var WELCOME_MESSAGE = 'नमस्ते किसान भाई। आप नई फसल बेचना चाहते हैं, या अपना टोकन नंबर देखना चाहते हैं? माइक दबाकर बोलें।';

  var SELL_KEYWORDS = ['बेचना', 'फसल', 'book', 'bechna', 'रजिस्ट्रेशन', 'पंजीकरण', 'register', 'registration', 'बेचनी'];
  var TOKEN_KEYWORDS = ['नंबर', 'टोकन', 'number', 'token', 'कतार', 'queue', 'लाइन'];
  var TRACK_KEYWORDS = ['रसीद', 'पैसे', 'स्टेटस', 'ट्रैक', 'receipt', 'payment', 'track', 'status', 'पर्ची', 'ट्रैकिंग'];
  var FORM_KEYWORDS = ['फॉर्म', 'लिख', 'form', 'type', 'मैनुअल'];

  function setState(state){
    micWrap.classList.remove('idle', 'listening', 'thinking');
    micBtn.classList.remove('listening', 'thinking');
    if (state === 'idle'){
      micWrap.classList.add('idle');
    } else if (state === 'listening'){
      micWrap.classList.add('listening');
      micBtn.classList.add('listening');
    } else if (state === 'thinking'){
      micWrap.classList.add('thinking');
      micBtn.classList.add('thinking');
    }
  }

  function pickHindiVoice(){
    if (!synth) return;
    var voices = synth.getVoices();
    hindiVoice = voices.find(function(v){ return v.lang === 'hi-IN'; }) ||
                 voices.find(function(v){ return v.lang && v.lang.indexOf('hi') === 0; }) ||
                 null;
  }

  if (synth){
    pickHindiVoice();
    synth.onvoiceschanged = pickHindiVoice;
  }

  function speak(text){
    assistantText.textContent = text;
    if (!synth) return;
    synth.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'hi-IN';
    if (hindiVoice) utter.voice = hindiVoice;
    utter.rate = 0.95;
    utter.pitch = 1;
    synth.speak(utter);
  }

  function normalize(str){
    return (str || '').toLowerCase();
  }

  function matchesAny(transcript, keywords){
    var lower = normalize(transcript);
    return keywords.some(function(k){ return lower.indexOf(normalize(k)) !== -1; });
  }

  function handleTranscript(transcript){
    transcriptText.textContent = 'आपने कहा: "' + transcript + '"';
    setState('thinking');
    tapHint.textContent = 'समझ रहे हैं...';

    function goToPage(url) {
      setTimeout(function() {
        window.location.href = url;
      }, 1500);
    }

    if (matchesAny(transcript, TOKEN_KEYWORDS)){
      speak('आपको कतार पेज पर ले जाया जा रहा है');
      goToPage('queue.html');
    } else if (matchesAny(transcript, TRACK_KEYWORDS)){
      speak('आपकी रसीद और पेमेंट का स्टेटस पेज खुल रहा है');
      goToPage('tracking.html');
    } else if (matchesAny(transcript, FORM_KEYWORDS)){
      speak('लिखकर फॉर्म भरने वाला पेज खुल रहा है');
      goToPage('manual-login.html');
    } else if (matchesAny(transcript, SELL_KEYWORDS)){
      speak('ठीक है, फसल बेचने के लिए आगे बढ़ते हैं');
      goToPage('visual-login.html');
    } else {
      setState('idle');
      tapHint.textContent = 'माइक दबाकर बोलें';
      speak('माफ़ कीजिए, समझ नहीं पाया। कृपया "टोकन", "रसीद", या "फसल बेचना" बोलें।');
    }
  }

  function startListening(){
    if (!recognition || isListening) return;
    if (synth) synth.cancel();
    transcriptText.textContent = '';
    try {
      recognition.start();
    } catch (err){}
  }

  function initRecognition(){
    if (!SpeechRecognitionAPI){
      unsupportedBanner.style.display = 'block';
      micBtn.disabled = true;
      tapHint.textContent = 'नीचे बटन से फॉर्म भरें';
      return;
    }

    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'hi-IN';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){
      isListening = true;
      setState('listening');
      tapHint.textContent = 'सुन रहे हैं... बोलिए';
      assistantText.textContent = 'सुन रहा हूँ...';
    };

    recognition.onresult = function(event){
      var transcript = event.results && event.results[0] && event.results[0][0]
        ? event.results[0][0].transcript
        : '';
      handleTranscript(transcript);
    };

    recognition.onerror = function(event){
      isListening = false;
      setState('idle');
      if (event.error === 'no-speech'){
        tapHint.textContent = 'कुछ सुनाई नहीं दिया, फिर कोशिश करें';
        speak('कुछ सुनाई नहीं दिया। कृपया फिर से माइक दबाएँ।');
      } else {
        tapHint.textContent = 'माइक दबाकर बोलें';
      }
    };

    recognition.onend = function(){
      isListening = false;
      if (!micBtn.classList.contains('thinking')){
        setState('idle');
      }
    };

    micBtn.addEventListener('click', startListening);
  }

  initRecognition();

  window.addEventListener('load', function(){
    setState('idle');
    speak(WELCOME_MESSAGE);
  });

})();
</script>
</body>
</html>
