<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>किसान खरीद सेवा — Kisan Procurement Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #2f7cc9;
    --sky-mid: #7fb8e8;
    --sky-glow: #ffd98a;
    --field: #2f7a35;
    --field-deep: #1f5a26;
    --field-dry: #c9a227;
    --soil: #6b4226;
    --sun: #ffb347;
    --paper: #fff8e8;
    --ink: #1c2b18;
    --ink-soft: #3a4a34;
    --radius-lg: 28px;
    --radius-md: 18px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    min-height: 100%;
  }

  body{
    font-family: 'Hind', sans-serif;
    color: var(--ink);
    background: var(--field-deep);
    overflow-x: hidden;
  }

  .scene{
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(
      to bottom,
      var(--sky-top) 0%,
      var(--sky-mid) 32%,
      var(--sky-glow) 46%,
      var(--field) 52%,
      var(--field-deep) 100%
    );
    overflow: hidden;
  }

  .sun{
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3cf, var(--sun) 70%);
    box-shadow: 0 0 60px 18px rgba(255,179,71,0.45);
    opacity: 0;
    animation: rise 1.4s ease-out 0.15s forwards;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.85); }
    to{ opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  .birds{
    position: absolute;
    top: 15%;
    width: 100%;
    opacity: 0.85;
  }
  .birds svg{ display:block; width: 100%; height: 46px; }

  .field-rows{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 42%;
    background:
      repeating-linear-gradient(
        180deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 2px,
        transparent 2px,
        transparent 14px
      );
    pointer-events: none;
  }

  .stalks{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 64px;
    display: flex;
    align-items: flex-end;
    justify-content: space-evenly;
    opacity: 0.9;
  }
  .stalks svg{ height: 100%; }

  .content{
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: clamp(20px, 6vw, 40px) clamp(18px, 6vw, 32px) 28px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }

  header{
    text-align: center;
    margin-top: clamp(64px, 18vw, 96px);
    margin-bottom: clamp(28px, 8vw, 40px);
  }

  .badge{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(2px);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    margin-bottom: 14px;
  }

  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 8vw, 2.6rem);
    line-height: 1.15;
    margin: 0 0 10px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(31,90,38,0.35);
  }

  .sub{
    font-size: clamp(1rem, 4vw, 1.15rem);
    color: rgba(255,255,255,0.95);
    line-height: 1.55;
    max-width: 34ch;
    margin: 0 auto;
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0,0,0,0.18);
  }

  .entries{
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: auto;
  }

  .entry{
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .entry:active{ transform: scale(0.97); }
  .entry:focus-visible{
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  .entry--voice{
    padding: 26px 22px;
    border-radius: var(--radius-lg);
    background: linear-gradient(155deg, #ffd66b, var(--sun) 55%, #f28c2b);
    box-shadow: 0 14px 30px -8px rgba(120,60,0,0.55), inset 0 1px 0 rgba(255,255,255,0.5);
  }

  .entry--voice .icon-wrap{
    flex: 0 0 auto;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    position: relative;
  }

  .pulse-ring{
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.7);
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform: scale(0.85); opacity: 0.9; }
    75%{ transform: scale(1.35); opacity: 0; }
    100%{ opacity: 0; }
  }

  .entry--voice .entry-text .headline{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(1.15rem, 5vw, 1.4rem);
    color: #4a2600;
    line-height: 1.3;
  }
  .entry--voice .entry-text .note{
    font-size: 0.92rem;
    color: #6b3d00;
    font-weight: 500;
    margin-top: 3px;
  }

  .entry--manual{
    padding: 20px 22px;
    border-radius: var(--radius-md);
    background: var(--paper);
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.28);
  }

  .entry--manual .icon-wrap{
    flex: 0 0 auto;
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: rgba(47,122,53,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .entry--manual .entry-text .headline{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: clamp(1.02rem, 4.2vw, 1.15rem);
    color: var(--field-deep);
  }
  .entry--manual .entry-text .note{
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .arrow{
    margin-left: auto;
    flex: 0 0 auto;
    font-size: 1.3rem;
    opacity: 0.75;
  }
  .entry--voice .arrow{ color: #4a2600; }
  .entry--manual .arrow{ color: var(--field-deep); }

  footer{
    text-align: center;
    margin-top: 22px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.85);
    line-height: 1.5;
  }
  footer strong{ color: #fff; }

  @media (min-width: 540px){
    .scene{ align-items: center; }
    .content{ padding-top: 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    .sun, .pulse-ring{ animation: none; }
    .sun{ opacity: 1; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="sun" aria-hidden="true"></div>

  <div class="birds" aria-hidden="true">
    <svg viewBox="0 0 400 40" preserveAspectRatio="none">
      <path d="M40 20 q6 -10 12 0 q6 -10 12 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path d="M160 12 q5 -8 10 0 q5 -8 10 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M300 24 q5 -8 10 0 q5 -8 10 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    </svg>
  </div>

  <div class="field-rows" aria-hidden="true"></div>

  <div class="stalks" aria-hidden="true">
    <svg viewBox="0 0 20 60" width="14"><path d="M10 60 L10 15 M10 15 L4 5 M10 15 L16 5 M10 28 L3 20 M10 28 L17 20" stroke="var(--field-dry)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 20 60" width="14"><path d="M10 60 L10 10 M10 10 L4 1 M10 10 L16 1 M10 24 L3 15 M10 24 L17 15 M10 38 L4 30 M10 38 L16 30" stroke="var(--field-dry)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 20 60" width="14"><path d="M10 60 L10 18 M10 18 L4 8 M10 18 L16 8" stroke="var(--field-dry)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 20 60" width="14"><path d="M10 60 L10 12 M10 12 L4 3 M10 12 L16 3 M10 26 L3 18 M10 26 L17 18" stroke="var(--field-dry)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 20 60" width="14"><path d="M10 60 L10 16 M10 16 L4 6 M10 16 L16 6" stroke="var(--field-dry)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 20 60" width="14"><path d="M10 60 L10 8 M10 8 L4 -1 M10 8 L16 -1 M10 22 L3 14 M10 22 L17 14 M10 36 L4 28 M10 36 L16 28" stroke="var(--field-dry)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 20 60" width="14"><path d="M10 60 L10 20 M10 20 L4 10 M10 20 L16 10" stroke="var(--field-dry)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </div>

  <div class="content">
    <header>
      <span class="badge">🌾 किसान खरीद सेवा</span>
      <h1>अपनी फसल बेचें, सीधे और आसानी से</h1>
      <p class="sub">सही दाम, सीधा भुगतान — शुरू करने के लिए अपना तरीका चुनें</p>
    </header>

    <div class="entries">
      <button class="entry entry--voice" onclick="selectMode('voice', 'visual-login.html')">
        <span class="icon-wrap">
          <span class="pulse-ring" aria-hidden="true"></span>
          🎙️
        </span>
        <span class="entry-text">
          <span class="headline">किसान कार्ड या अंगूठे से चलाएं</span>
          <span class="note">पढ़ना-लिखना ज़रूरी नहीं</span>
        </span>
        <span class="arrow" aria-hidden="true">➜</span>
      </button>

      <button class="entry entry--manual" onclick="selectMode('manual', 'manual-login.html')">
        <span class="icon-wrap">✍️</span>
        <span class="entry-text">
          <span class="headline">लिखकर फॉर्म भरें</span>
          <span class="note">मोबाइल नंबर और जानकारी दर्ज करें</span>
        </span>
        <span class="arrow" aria-hidden="true">➜</span>
      </button>
    </div>

    <footer>
      किसी भी समस्या के लिए अपने नज़दीकी <strong>खरीद केंद्र</strong> पर संपर्क करें
    </footer>
  </div>
</div>

<script>
  // Save preference to localStorage when starting
  function selectMode(mode, url) {
    try {
      localStorage.setItem('kisan_mode', mode);
      localStorage.setItem('kisan_lang', 'hi'); // Default setting Hindi
    } catch(e) {}
    window.location.href = url;
  }
</script>

</body>
</html>
